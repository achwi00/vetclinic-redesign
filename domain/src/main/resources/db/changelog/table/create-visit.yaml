databaseChangeLog:
  - changeSet:
      id: create-visit
      author: achwi00
      changes:
        - createTable:
            tableName: VISIT
            columns:
              - column:
                  name: ID
                  type: BIGINT AUTO_INCREMENT
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: NOTES
                  type: VARCHAR(1000)

              - column:
                  name: APPOINTMENT_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true